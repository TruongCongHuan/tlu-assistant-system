name: tlu_ai_assistant
description: TLU AI Assistant - RAG + TTS + STT

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── UI ──────────────────────────────────────────────
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0       # Smooth animations
  flutter_markdown: ^0.7.2

  # ── State ────────────────────────────────────────────
  provider: ^6.1.1

  # ── AI / Gemini ───────────────────────────────────────
  google_generative_ai: ^0.4.3

  # ── PDF ───────────────────────────────────────────────
  file_picker: ^8.0.0

  # ── Vector Store ──────────────────────────────────────
  sqflite: ^2.3.0
  path_provider: ^2.1.2
  path: ^1.9.0

  # ── TTS ───────────────────────────────────────────────
  flutter_tts: ^4.0.2           # Android + iOS

  # ── STT ───────────────────────────────────────────────
  speech_to_text: ^6.6.2        # Android 11+ / iOS

  # ── Permissions ───────────────────────────────────────
  permission_handler: ^11.3.1

  # ── Local notifications (demo BFF — thay FCM tạm) ─────
  flutter_local_notifications: ^17.2.4

  # ── HTTP (remote RAG backend) ─────────────────────────
  http: ^1.2.2

  # ── Utils ─────────────────────────────────────────────
  uuid: ^4.3.3
  shared_preferences: ^2.2.3
  intl: ^0.19.0                 # Format date/time
  firebase_core: ^3.4.0
  cloud_firestore: ^5.4.0
  webview_flutter: ^4.8.0
  url_launcher: ^6.3.1
  firebase_storage: ^12.2.0
  firebase_auth: ^5.2.0
  # Giữ <15.1.3 để tương thích Dart 3.3.x (firebase_core_web 2.18+ cần SDK >=3.4).
  firebase_messaging: '>=15.0.0 <15.1.3'
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
